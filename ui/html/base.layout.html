<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Forum</title>
    <link rel="stylesheet" href="/static/css/style.css?v=2">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">GoForum</a>

            <div class="nav-links">
                {{if .IsLoggedIn}}
                    <a href="/activity" class="nav-link">Activity</a>
                    <a href="/notifications" class="nav-link nav-notification" aria-label="Notifications">
                        Notifications
                        <span id="notification-badge" class="notification-badge {{if eq .UnreadNotifications 0}}is-hidden{{end}}">{{.UnreadNotifications}}</span>
                    </a>
                    <span class="nav-user">Welcome, <b>{{.User.Username}}</b></span>
                    <a href="/logout" class="btn btn-outline">Logout</a>
                {{else}}
                    <a href="/login" class="nav-link">Login</a>
                    <a href="/register" class="btn btn-primary">Register</a>
                {{end}}
            </div>
        </div>
    </nav>

    <main class="page">
        <div class="container">
            {{template "content" .}}
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2025 Go Forum Project</p>
    </footer>
    {{if .IsLoggedIn}}
    <script>
        (function () {
            var badge = document.getElementById("notification-badge");
            if (!badge || typeof EventSource === "undefined") {
                return;
            }

            var stream = new EventSource("/notifications/stream");
            stream.onmessage = function (event) {
                var count = parseInt(event.data, 10);
                if (Number.isNaN(count)) {
                    return;
                }
                badge.textContent = String(count);
                badge.classList.toggle("is-hidden", count === 0);
            };
        }());
    </script>
    {{end}}
</body>
</html>
