<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Forum</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">GoForum</a>
            <div class="nav-links">
                {{if .IsLoggedIn}}
                    <span style="margin-right: 1rem;">Welcome, <b>{{.User.Username}}</b></span>
                    <a href="/logout" class="btn btn-outline" style="color: white; border: 1px solid var(--border);">Logout</a>
                {{else}}
                    <a href="/login" style="margin-right: 1rem; color: white; text-decoration: none;">Login</a>
                    <a href="/register" class="btn btn-primary">Register</a>
                {{end}}
            </div>
        </div>
    </nav>

    <main>
        {{template "content" .}}
    </main>

    <footer>
        <p style="text-align: center; padding: 2rem; color: var(--text-muted);">&copy; 2025 Go Forum Project</p>
    </footer>
</body>
</html>
