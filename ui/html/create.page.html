{{define "content"}}
<div class="auth-page">
    <div class="auth-card create-card">
        <h2 class="auth-title">Create New Post</h2>

        <form action="/post/create" method="POST">
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" required placeholder="What's the topic?">
                <div class="helper">Keep it clear and specific (8–120 characters).</div>
            </div>

            <div class="form-group">
                <label>Content</label>
                <textarea name="content" rows="6" required placeholder="Write your post..."></textarea>
            </div>

            <div class="form-group">
                <label>Categories (select one or more)</label>
                <div class="category-box">
                    {{range .Categories}}
                        <label class="category-pill">
                            <input type="checkbox" name="categories" value="{{.}}">
                            <span>#{{.}}</span>
                        </label>
                    {{end}}
                </div>
            </div>

            <div class="form-actions">
                <a href="/" class="btn btn-outline btn-block">Cancel</a>
                <button type="submit" class="btn btn-primary btn-block">🚀 Publish Post</button>
            </div>
        </form>
    </div>
</div>
{{end}}
